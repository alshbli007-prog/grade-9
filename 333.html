        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playWhistle() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2500, now);
                osc.frequency.setValueAtTime(2800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playKick() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
            playGoal() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [440, 554, 659, 880].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
            playCorrect() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playWrong() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playTimeout() {
                this.playWrong();
            }
            playClick() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

                            <p class="text-xs font-bold text-slate-400">العمود الثاني (الخيارات):</p>
                            ${q.optionsPool.map(op => {
                                let isUsed = Object.values(gameState.matchingSelections).includes(op.key);
                                let opStyle = "bg-slate-950 border-slate-700 text-slate-200";
                                if (isUsed) opStyle = "bg-slate-900 border-slate-800 text-slate-500 opacity-70";

                                return `
                                    <div onclick="selectMatchOption('${op.key}')" class="p-3 rounded-xl border cursor-pointer font-semibold transition flex items-center gap-3 ${opStyle}">
                                        <span class="w-6 h-6 rounded bg-slate-800 flex items-center justify-center font-bold text-cyan-400 text-xs">${op.key}</span>
                                        <span class="flex-1">${op.text}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function setScreen(screenName) {
            gameState.screen = screenName;
            render();
        }

        function setMode(mode) {
            gameState.mode = mode;
            render();
        }

        function startMatch() {
            if (gameState.mode === 'single') {
                const nameInput = document.getElementById('player-name-input');
                if (nameInput && nameInput.value.trim()) {
                    gameState.playerName = nameInput.value.trim();
                }
                gameState.scores = [0, 0];
            } else {
                const teamsInput = document.getElementById('teams-input');
                if (teamsInput && teamsInput.value.trim()) {
                    gameState.teams = teamsInput.value.split(',').map(t => t.trim()).filter(t => t.length > 0);
                    if (gameState.teams.length < 2) gameState.teams = ['فريق الصقور', 'فريق النمور'];
                }
                gameState.scores = new Array(gameState.teams.length).fill(0);
                gameState.currentTeamIndex = 0;
            }

            // Shuffle questions and randomize options for each question while keeping track of correct answers
            gameState.shuffledQuestions = questionsData.map(q => {
                let qCopy = JSON.parse(JSON.stringify(q));
                if (qCopy.options) {
                    // find correct option text
                    let correctOptObj = qCopy.options.find(o => o.id === qCopy.correct);
                    let correctText = correctOptObj ? correctOptObj.text : '';
                    
                    // shuffle options
                    qCopy.options = shuffleArray(qCopy.options);
                    
                    // assign new ids a, b, c, d and re-identify correct id
                    let newCorrectId = 'a';
                    qCopy.options.forEach((opt, idx) => {
                        let newId = ['a', 'b', 'c', 'd'][idx];
                        opt.id = newId;
                        if (opt.text === correctText) {
                            newCorrectId = newId;
                        }
                    });
                    qCopy.correct = newCorrectId;
                }
                return qCopy;
            });

            gameState.currentQuestionIndex = 0;
            gameState.selectedOption = null;
            gameState.isAnswerConfirmed = false;
            gameState.matchOver = false;
            gameState.matchingSelections = {};
            gameState.activeTermId = null;
            gameState.answersRecord = [];

            setScreen('game');
            startTimer();
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
            // Timer rule: Direct questions 30s, Visual/analytical 40s, Matching 50s
            if (q.type === 'matching') {
                gameState.timeLeft = 50;
            } else if (q.visual && q.visual.includes('periodic')) {
                gameState.timeLeft = 40;
            } else {
                gameState.timeLeft = 30;
            }

            gameState.timerInterval = setInterval(() => {
                if (gameState.isAnswerConfirmed || gameState.matchOver) return;
                gameState.timeLeft--;
                const timerEl = document.getElementById('timer-display');
                if (timerEl) timerEl.innerText = gameState.timeLeft + 'ث';

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function selectOption(id) {
            soundFX.playClick();
            gameState.selectedOption = id;
            render();
        }

        function selectTerm(termId) {
            soundFX.playClick();
            gameState.activeTermId = termId;
            render();
        }

        function selectMatchOption(key) {
            soundFX.playClick();
            if (!gameState.activeTermId) return;
            gameState.matchingSelections[gameState.activeTermId] = key;
            gameState.activeTermId = null;
            render();
        }

        function resetMatching() {
            soundFX.playClick();
            gameState.matchingSelections = {};
            gameState.activeTermId = null;
            render();
        }

        function handleTimeout() {
            soundFX.playTimeout();
            const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
            gameState.isAnswerConfirmed = true;

            // Goal for rival
            if (gameState.mode === 'single') {
                gameState.scores[1]++;
            } else {
                // In multi mode, current team loses a goal / rival scores
                let rivalIdx = (gameState.currentTeamIndex + 1) % gameState.scores.length;
                gameState.scores[rivalIdx]++;
            }

            gameState.answersRecord.push({
                qNum: gameState.currentQuestionIndex + 1,
                question: q.title,
                studentAnswer: 'لم يتم الإجابة (انتهى الوقت)',
                correctAnswer: q.type === 'matching' ? 'توصيل صحيح' : q.options.find(o => o.id === q.correct).text,
                isCorrect: false,
                explanation: q.explanation
            });

            showNotification('⏱️ انتهى الوقت!', '⚽ هدف للفريق المنافس بسبب تأخر الإجابة.', false);
        }

        function confirmAnswer() {
            const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
            
            if (q.type === 'matching') {
                // check if all 4 matched
                if (Object.keys(gameState.matchingSelections).length < 4) {
                    alert('يرجى إكمال توصيل جميع العناصر قبل التأكيد.');
                    return;
                }
            } else {
                if (!gameState.selectedOption) {
                    alert('يرجى اختيار إجابة أولاً.');
                    return;
                }
            }

            clearInterval(gameState.timerInterval);
            gameState.isAnswerConfirmed = true;

            let isCorrect = false;
            let studentAnsText = '';

            if (q.type === 'matching') {
                isCorrect = true;
                for (let k in q.correctMapping) {
                    if (gameState.matchingSelections[k] !== q.correctMapping[k]) {
                        isCorrect = false;
                        break;
                    }
                }
                studentAnsText = JSON.stringify(gameState.matchingSelections);
            } else {
                isCorrect = gameState.selectedOption === q.correct;
                let optObj = q.options.find(o => o.id === gameState.selectedOption);
                studentAnsText = optObj ? optObj.text : '';
            }

            gameState.isCorrect = isCorrect;

            let correctAnsText = q.type === 'matching' ? 'التوصيل الصحيح للمجموعات' : q.options.find(o => o.id === q.correct).text;

            gameState.answersRecord.push({
                qNum: gameState.currentQuestionIndex + 1,
                question: q.title,
                studentAnswer: studentAnsText,
                correctAnswer: correctAnsText,
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            if (isCorrect) {
                soundFX.playCorrect();
                soundFX.playGoal();
                if (gameState.mode === 'single') {
                    gameState.scores[0]++;
                } else {
                    gameState.scores[gameState.currentTeamIndex]++;
                }
                animateBall('home');
                showNotification('🎯 إجابة صحيحة!', '⚽ GOAL! هدف رائع لصالح فريقك!', true);
            } else {
                soundFX.playWrong();
                if (gameState.mode === 'single') {
                    gameState.scores[1]++;
                } else {
                    let rivalIdx = (gameState.currentTeamIndex + 1) % gameState.scores.length;
                    gameState.scores[rivalIdx]++;
                }
                animateBall('away');
                showNotification('❌ إجابة غير صحيحة.', '⚽ للأسف، سجل الفريق المنافس هدفًا.', false);
            }
            
            // Re-render UI to show confirmation state and next question button properly
            render();
        }

        function animateBall(direction) {
            const ball = document.getElementById('football-icon');
            if (!ball) return;
            if (direction === 'home') {
                ball.classList.add('animate-kick-home');
            } else {
                ball.classList.add('animate-kick-away');
            }
        }

        function showNotification(title, sub, isGoal) {
            const notif = document.getElementById('pitch-notification');
            const tEl = document.getElementById('notification-text');
            const sEl = document.getElementById('notification-sub');
            if (notif && tEl && sEl) {
                tEl.innerText = title;
                tEl.className = `text-2xl sm:text-3xl font-black mb-2 ${isGoal ? 'text-emerald-400' : 'text-rose-400'}`;
                sEl.innerText = sub;
                notif.classList.remove('hidden');
            }
        }

        function nextQuestion() {
            soundFX.playClick();
            // rotate team turn in multi mode
            if (gameState.mode === 'multi') {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            }

            gameState.currentQuestionIndex++;
            if (gameState.currentQuestionIndex >= gameState.shuffledQuestions.length) {
                // Match Over
                gameState.matchOver = true;
                setScreen('summary');
            } else {
                gameState.selectedOption = null;
                gameState.isAnswerConfirmed = false;
                gameState.matchingSelections = {};
                gameState.activeTermId = null;
                setScreen('game');
                startTimer();
            }
        }

        function renderSummaryScreen() {
            let p1Score = gameState.scores[0];
            let p2Score = gameState.scores[1]; // or max rival
            if (gameState.mode === 'multi') {
                // Find highest scoring team
                p1Score = Math.max(...gameState.scores);
            }

            let correctCount = gameState.answersRecord.filter(a => a.isCorrect).length;
            let wrongCount = gameState.answersRecord.filter(a => !a.isCorrect && !a.studentAnswer.includes('انتهى الوقت')).length;
            let timeoutCount = gameState.answersRecord.filter(a => a.studentAnswer.includes('انتهى الوقت')).length;
            let percentage = Math.round((correctCount / 20) * 100);

            let rankTitle = "";
            let rankDesc = "";
            if (percentage >= 90) {
                rankTitle = "🧠 عبقري الجدول الدوري";
                rankDesc = "أداء استثنائي وفهم عميق جداً لجميع مفاهيم الوحدة الثالثة!";
            } else if (percentage >= 80) {
                rankTitle = "🔬 خبير العناصر";
                rankDesc = "ممتاز! إدراك ممتاز لتصنيف العناصر والمجموعات والدورات.";
            } else if (percentage >= 70) {
                rankTitle = "⚗️ عالم واعد";
                rankDesc = "جيد جداً! لديك أساسيات قوية في الجدول الدوري للوحدة الثالثة.";
            } else if (percentage >= 60) {
                rankTitle = "🔎 مستكشف العناصر";
                rankDesc = "جيد، ولكن تحتاج إلى مراجعة إضافية لخصائص الفلزات واللافلزات.";
            } else {
                rankTitle = "🧪 متدرب الكيمياء";
                rankDesc = "تحتاج إلى إعادة قراءة الوحدة الثالثة والتركيز على المجموعات والدورات.";
            }

            let matchResultText = "";
            if (gameState.mode === 'single') {
                if (gameState.scores[0] > gameState.scores[1]) matchResultText = "🏆 فوز فريق اللاعب!";
                else if (gameState.scores[0] < gameState.scores[1]) matchResultText = "⚽ فوز الفريق المنافس";
                else matchResultText = "🤝 تعادل الفريقين!";
            } else {
                matchResultText = "🏆 انتهت مباراة الدوري بنجاح!";
            }

            return `
                <div class="flex flex-col items-center justify-center p-4 sm:p-8 bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md max-w-2xl mx-auto my-auto w-full">
                    <h2 class="text-2xl sm:text-3xl font-black text-cyan-400 mb-2">🏆 انتهت المباراة!</h2>
                    <p class="text-lg font-bold text-slate-200 mb-4">${matchResultText}</p>

                    <!-- Score Box -->
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 w-full mb-6 text-center">
                        <div class="text-xl font-black text-emerald-400 mb-1">${gameState.mode === 'single' ? gameState.playerName : 'نتيجة الفرق'}</div>
                        <div class="text-2xl font-mono text-white mb-3">
                            ${gameState.mode === 'single' ? `${gameState.scores[0]} - ${gameState.scores[1]}` : gameState.teams.map((t, idx) => `${t}: ${gameState.scores[idx]}`).join(' | ')}
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs border-t border-slate-800 pt-3">
                            <div><span class="text-emerald-400 font-bold">✅ صحيحة:</span> ${correctCount}</div>
                            <div><span class="text-rose-400 font-bold">❌ خاطئة:</span> ${wrongCount}</div>
                            <div><span class="text-amber-400 font-bold">⏱️ متأخرة:</span> ${timeoutCount}</div>
                        </div>
                        <div class="mt-3 text-lg font-bold text-cyan-400">النسبة المئوية: ${percentage}%</div>
                    </div>

                    <!-- Rank Badge -->
                    <div class="bg-gradient-to-r from-emerald-900/40 to-cyan-900/40 border border-emerald-500/50 rounded-xl p-4 w-full mb-6 text-center shadow-lg">
                        <div class="text-xl font-black text-amber-300 mb-1">${rankTitle}</div>
                        <p class="text-xs text-slate-300">${rankDesc}</p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 w-full">
                        <button onclick="soundFX.playClick(); startMatch()" class="flex-1 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition">
                            🔄 إعادة المباراة
                        </button>
                        <button onclick="soundFX.playClick(); setScreen('review')" class="flex-1 py-3 px-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl shadow transition">
                            📚 مراجعة الإجابات
                        </button>
                        <button onclick="soundFX.playClick(); setScreen('splash')" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition">
                            🏠 الرئيسية
                        </button>
                    </div>
                </div>
            `;
        }

        function renderReviewScreen() {
            return `
                <div class="flex flex-col w-full max-w-3xl mx-auto space-y-4 my-auto">
                    <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
                        <h2 class="text-xl font-black text-cyan-400">📚 مراجعة الإجابات (الوحدة الثالثة)</h2>
                        <button onclick="soundFX.playClick(); setScreen('summary')" class="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold rounded-xl transition">
                            ↩️ العودة للنتائج
                        </button>
                    </div>

                    <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                        ${gameState.answersRecord.map((ans, idx) => `
                            <div class="bg-slate-900/90 border ${ans.isCorrect ? 'border-emerald-500/50' : 'border-rose-500/50'} rounded-xl p-4 shadow">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-bold text-cyan-400">السؤال ${ans.qNum}</span>
                                    <span class="px-2 py-0.5 rounded text-xs font-bold ${ans.isCorrect ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-rose-500/20 text-rose-400 border border-rose-500'}">
                                        ${ans.isCorrect ? '✅ صحيحة' : '❌ خاطئة'}
                                    </span>
                                </div>
                                <p class="text-sm font-bold text-white mb-2">${ans.question}</p>
                                <div class="text-xs space-y-1 mb-2 bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                                    <p><span class="text-slate-400">إجابتك:</span> <span class="${ans.isCorrect ? 'text-emerald-300 font-bold' : 'text-rose-300 font-bold'}">${ans.studentAnswer}</span></p>
                                    ${!ans.isCorrect ? `<p><span class="text-slate-400">الإجابة الصحيحة:</span> <span class="text-emerald-300 font-bold">${ans.correctAnswer}</span></p>` : ''}
                                </div>
                                <div class="text-xs bg-cyan-950/40 border border-cyan-800/50 p-2 rounded-lg text-cyan-200">
                                    💡 <span class="font-bold">التفسير العلمي:</span> ${ans.explanation}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Initialize App on load
        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
