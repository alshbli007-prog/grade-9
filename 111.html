        class SoundEngine {
            constructor() {
                this.muted = false;
                this.audioCtx = null;
            }
            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
            }
            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + duration);
                } catch(e) {
                    console.log('Audio error:', e);
                }
            }
            whistle() {
                this.playTone(2500, 'sine', 0.15, 0.15);
                setTimeout(() => this.playTone(3200, 'sine', 0.3, 0.15), 150);
            }
            kick() {
                this.playTone(120, 'triangle', 0.2, 0.3);
            }
            goal() {
                if (this.muted) return;
                let notes = [440, 554, 659, 880];
                notes.forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'square', 0.25, 0.2), idx * 120);

            wrong() {
                this.playTone(180, 'sawtooth', 0.3, 0.2);
                setTimeout(() => this.playTone(130, 'sawtooth', 0.4, 0.2), 150);
            }
            clockTick() {
                this.playTone(800, 'sine', 0.05, 0.1);
            }

                notes.forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.3, 0.25), idx * 180);
                });
            }

                renderApp();
            }

            const keys = Object.keys(gameState.matchingSelections.pairs);

                delete gameState.matchingSelections.pairs[lastKey];

                        <button onclick="toggleAudio()" class="bg-emerald-900/80 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg border border-emerald-600/40 text-xs">
                            🔊 كتم / تفعيل الصوت
                        </button>
                    </div>
                </div>
            `;
        }

        function startSetup(mode) {
            sound.init();
            sound.whistle();
            gameState.gameMode = mode;
            gameState.screen = 'setup';
            renderApp();
        }

        function renderSetupScreen() {
            return `
                <div class="flex-1 flex flex-col justify-center items-center py-3 px-2 max-w-lg mx-auto w-full">
                    <div class="w-full bg-emerald-950/95 border-2 border-emerald-500/50 rounded-3xl p-4 sm:p-6 shadow-2xl text-center">
                        <h2 class="text-lg sm:text-xl font-black text-yellow-300 mb-3">⚙️ إعدادات المباراة</h2>
                        
                        <div class="space-y-3 text-right">
                            <div>
                                <label class="block text-xs font-bold text-emerald-200 mb-1">⏱️ وضع الوقت والسرعة:</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="setTimerMode('competition')" class="p-2 rounded-xl border font-bold text-xs transition ${gameState.timerMode === 'competition' ? 'bg-emerald-600 border-yellow-400 text-white shadow' : 'bg-emerald-900/50 border-emerald-700 text-emerald-300'}">
                                        🏆 وضع المنافسة (مع مؤقت)
                                    </button>
                                    <button onclick="setTimerMode('training')" class="p-2 rounded-xl border font-bold text-xs transition ${gameState.timerMode === 'training' ? 'bg-emerald-600 border-yellow-400 text-white shadow' : 'bg-emerald-900/50 border-emerald-700 text-emerald-300'}">
                                        🏠 وضع التدريب (بدون مؤقت)
                                    </button>
                                </div>
                            </div>

                            ${gameState.gameMode === 'solo' ? `
                                <div>
                                    <label class="block text-xs font-bold text-emerald-200 mb-1">👤 اسم الطالب / الفريق:</label>
                                    <input type="text" id="player-name-input" value="فريق الطالب" class="w-full bg-emerald-900/80 border border-emerald-600 rounded-xl px-3 py-2 text-white font-bold text-xs sm:text-sm focus:outline-none focus:border-yellow-400">
                                </div>
                            ` : `
                                <div>
                                    <label class="block text-xs font-bold text-emerald-200 mb-1">👥 عدد الفرق المتنافسة (2 إلى 4):</label>
                                    <div class="flex gap-2 mb-2">
                                        ${[2, 3, 4].map(n => `
                                            <button onclick="setNumTeams(${n})" class="flex-1 py-1.5 rounded-xl font-bold text-xs border ${gameState.numTeams === n ? 'bg-cyan-600 border-yellow-400 text-white' : 'bg-emerald-900/50 border-emerald-700 text-emerald-300'}">
                                                ${n} فرق
                                            </button>
                                        `).join('')}
                                    </div>
                                    <div class="space-y-1.5">
                                        ${Array(gameState.numTeams).fill(0).map((_, i) => `
                                            <input type="text" id="team-name-${i}" value="${gameState.teams[i].name}" class="w-full bg-emerald-900/80 border border-emerald-600 rounded-xl px-2.5 py-1.5 text-white font-bold text-xs focus:outline-none focus:border-yellow-400">
                                        `).join('')}
                                    </div>
                                </div>
                            `}
                        </div>

                        <div class="flex gap-2.5 mt-5">
                            <button onclick="gameState.screen='home'; renderApp();" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-xl text-xs transition">
                                🔙 رجوع
                            </button>
                            <button onclick="launchMatch()" class="flex-1 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black py-2 rounded-xl text-xs sm:text-sm shadow-lg transition transform hover:-translate-y-0.5">
                                ⚽ انطلاق المباراة!
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setTimerMode(mode) {
            gameState.timerMode = mode;
            renderApp();
        }

        function setNumTeams(n) {
            gameState.numTeams = n;
            renderApp();
        }

        function launchMatch() {
            sound.whistle();
            if (gameState.gameMode === 'solo') {
                const nameInput = document.getElementById('player-name-input');
                const pName = nameInput ? nameInput.value.trim() : 'فريق الطالب';
                gameState.teams = [
                    { name: pName, score: 0 },
                    { name: 'فريق الكمبيوتر', score: 0 }
                ];
            } else {
                for (let i = 0; i < gameState.numTeams; i++) {
                    const tInput = document.getElementById(`team-name-${i}`);
                    if (tInput) gameState.teams[i].name = tInput.value.trim() || `الفريق ${i+1}`;
                }
                gameState.teams = gameState.teams.slice(0, gameState.numTeams);
                gameState.teams.forEach(t => t.score = 0);
            }

            let shuffled = shuffleArray(questionsData);
            gameState.questionsList = shuffled.map(q => {
                let qCopy = JSON.parse(JSON.stringify(q));
                if (qCopy.type === 'mcq') {
                    let indexedOptions = qCopy.options.map((opt, idx) => ({ opt, isCorrect: idx === qCopy.correct }));
                    let shuffledOpts = shuffleArray(indexedOptions);
                    qCopy.options = shuffledOpts.map(o => o.opt);
                    qCopy.correct = shuffledOpts.findIndex(o => o.isCorrect);
                }
                if (qCopy.type === 'order') {
                    qCopy.currentOrder = shuffleArray([0, 1, 2]);
                }
                return qCopy;
            });

            gameState.questionIndex = 0;
            gameState.currentTeamIndex = 0;
            gameState.userAnswers = [];
            gameState.matchOver = false;
            gameState.screen = 'game';
            setupQuestionState();
            renderApp();
        }

        function setupQuestionState() {
            gameState.selectedOption = null;
            gameState.showFeedback = false;
            gameState.lastResultStatus = null;
            gameState.ballState = 'center';

            const currentQ = gameState.questionsList[gameState.questionIndex];
            if (currentQ.type === 'matching') {
                gameState.matchingSelections = { selectedLeft: null, pairs: {} };
            }
            if (currentQ.type === 'order') {
                gameState.orderList = shuffleArray([0, 1, 2]);
            }

            if (gameState.timerMode === 'competition') {
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                gameState.timeLeft = currentQ.type === 'matching' || currentQ.type === 'order' ? 45 : 30;
                gameState.timerInterval = setInterval(() => {
                    if (gameState.timeLeft > 0 && !gameState.showFeedback) {
                        gameState.timeLeft--;
                        if (gameState.timeLeft <= 5) sound.clockTick();
                        renderApp();
                    } else if (gameState.timeLeft === 0 && !gameState.showFeedback) {
                        clearInterval(gameState.timerInterval);
                        handleTimeout();
                    }
                }, 1000);
            }
        }

        function handleTimeout() {
            const currentQ = gameState.questionsList[gameState.questionIndex];
            gameState.showFeedback = true;
            gameState.lastResultStatus = 'timeout';
            sound.wrong();

            gameState.userAnswers.push({
                questionId: currentQ.id,
                title: currentQ.title,
                question: currentQ.question,
                userAnswerText: 'انتهى الوقت دون إجابة',
                correctAnswerText: getCorrectAnswerText(currentQ),
                isCorrect: false,
                isTimeout: true,
                explanation: currentQ.explanation,
                visualType: currentQ.visualType
            });
            renderApp();
        }

        function getCorrectAnswerText(q) {
            if (q.type === 'mcq' || q.type === 'true_false') return q.options[q.correct];
            if (q.type === 'order') return 'الترتيب الصحيح: الصلبة ➔ السائلة ➔ الغازية';
            if (q.type === 'matching') return 'التوصيلات الصحيحة لجميع العناصر';
            return '';
        }

        function renderGameScreen() {
            const currentQ = gameState.questionsList[gameState.questionIndex];
            const activeTeam = gameState.teams[gameState.currentTeamIndex];
            const totalQ = gameState.questionsList.length;

            return `
                <div class="flex-1 flex flex-col justify-between max-w-4xl mx-auto w-full py-1">
                    <!-- Top Match Header & Scoreboard -->
                    <div class="bg-emerald-950/90 border border-emerald-600/50 rounded-2xl p-2 shadow-xl mb-1.5 flex flex-col sm:flex-row justify-between items-center gap-2">
                        <div class="flex items-center gap-2">
                            <span class="bg-yellow-500 text-slate-950 px-2 py-0.5 rounded-xl text-[11px] font-black shadow">
                                السؤال ${gameState.questionIndex + 1} / ${totalQ}
                            </span>
                            <span class="text-xs text-emerald-200 font-semibold">
                                الدور: <strong class="text-yellow-300">${activeTeam.name}</strong>
                            </span>
                        </div>

                        <!-- Scoreboard Display -->
                        <div class="flex items-center gap-2 bg-emerald-900/70 px-2.5 py-1 rounded-xl border border-emerald-700">
                            ${gameState.teams.map((t, idx) => `
                                <div class="text-center px-1 ${idx === gameState.currentTeamIndex ? 'border-b-2 border-yellow-400' : ''}">
                                    <span class="text-[10px] text-emerald-300 block">${t.name}</span>
                                    <span class="text-xs sm:text-sm font-black text-white">⚽ ${t.score}</span>
                                </div>
                            `).join('')}
                        </div>

                        ${gameState.timerMode === 'competition' ? `
                            <div class="bg-emerald-900 px-2.5 py-1 rounded-xl border border-emerald-600 text-yellow-300 font-mono font-bold text-xs">
                                ⏱️ ${gameState.timeLeft} ث
                            </div>
                        ` : `
                            <div class="bg-emerald-900 px-2 py-0.5 rounded-xl border border-emerald-600 text-emerald-300 text-xs">
                                🏠 تدريب
                            </div>
                        `}
                    </div>

                    <!-- Realistic Football Pitch & Match Arena Element -->
                    <div class="relative w-full h-28 sm:h-36 bg-gradient-to-b from-emerald-800 to-emerald-900 rounded-2xl border-2 border-white/20 overflow-hidden shadow-inner mb-1.5 pitch-pattern flex items-center justify-center">
                        <div class="absolute inset-x-0 top-1/2 border-t border-white/30"></div>
                        <div class="absolute w-16 h-16 sm:w-20 sm:h-20 border-2 border-white/30 rounded-full"></div>
                        <div class="absolute left-1.5 top-1/2 -translate-y-1/2 w-5 h-10 border-2 border-l-0 border-white/30 rounded-r-lg"></div>
                        <div class="absolute right-1.5 top-1/2 -translate-y-1/2 w-5 h-10 border-2 border-r-0 border-white/30 rounded-l-lg"></div>

                        <div class="absolute left-2 top-1/2 -translate-y-1/2 text-lg">🥅🧤</div>
                        <div class="absolute right-2 top-1/2 -translate-y-1/2 text-lg">🥅🧤</div>

                        <div id="stadium-ball" class="absolute text-lg transition-all duration-700 ease-in-out ${
                            gameState.ballState === 'center' ? 'left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2' :
                            gameState.ballState === 'moving_away' ? 'right-6 top-1/2 -translate-y-1/2 scale-125' :
                            gameState.ballState === 'moving_home' ? 'left-6 top-1/2 -translate-y-1/2 scale-125' : 'left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2'
                        }">
                            ⚽
                        </div>

                        ${gameState.ballState === 'moving_away' || gameState.ballState === 'moving_home' ? `
                            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center animate-pulse">
                                <h3 class="text-base sm:text-xl font-black text-yellow-300 mb-0.5">
                                    ${gameState.ballState === 'moving_away' ? '⚡ هجمة ناجحة وتسديدة قوية!' : '❌ هجمة ضائعة وارتداد خطير!'}
                                </h3>
                                <p class="text-white text-xs sm:text-sm font-bold">
                                    ${gameState.ballState === 'moving_away' ? '⚽ جوووووووووول لصالح الفريق!' : '⚽ هدف للمنافس!'}
                                </p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Question Container & Visual Element -->
                    <div class="flex-1 bg-emerald-950/95 border-2 border-emerald-500/50 rounded-3xl p-3 sm:p-4 shadow-2xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="bg-emerald-800 text-cyan-300 px-2.5 py-0.5 rounded-full text-[11px] font-bold border border-emerald-600">
                                    📌 ${currentQ.title}
                                </span>
                                <span class="text-[10px] text-emerald-300">الوحدة الأولى: حالات المادة</span>
                            </div>

                            ${renderScientificVisual(currentQ.visualType, currentQ)}

                            <h3 class="text-xs sm:text-sm font-bold text-white mb-2.5 text-right leading-relaxed">
                                ${currentQ.question}
                            </h3>

                            ${!gameState.showFeedback ? renderQuestionInputs(currentQ) : renderFeedbackView(currentQ)}
                        </div>

                        <div class="mt-2.5 pt-2.5 border-t border-emerald-900 flex justify-between items-center">
                            <span class="text-[10px] text-emerald-400">الكيمياء - الصف التاسع - سلطنة عمان</span>
                            ${!gameState.showFeedback ? `
                                <button onclick="submitAnswer()" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black px-4 py-1.5 rounded-xl text-xs shadow-lg transition">
                                    ✅ تأكيد الإجابة
                                </button>
                            ` : `
                                <button onclick="nextQuestion()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black px-4 py-1.5 rounded-xl text-xs shadow-lg transition flex items-center gap-1.5">
                                    ➡️ السؤال التالي
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuestionInputs(q) {
            if (q.type === 'mcq' || q.type === 'true_false') {
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, idx) => `
                            <button onclick="selectOption(${idx})" class="text-right p-2.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between ${gameState.selectedOption === idx ? 'bg-emerald-600 border-yellow-400 text-white shadow-lg' : 'bg-emerald-900/60 border-emerald-700/80 text-emerald-100 hover:bg-emerald-900'}">
                                <span>${opt}</span>
                                <span class="w-4.5 h-4.5 rounded-full border border-emerald-400 flex items-center justify-center text-[10px] font-bold ${gameState.selectedOption === idx ? 'bg-yellow-400 text-slate-950 border-yellow-400' : 'text-emerald-300'}">
                                    ${['أ', 'ب', 'ج', 'د'][idx] || ''}
                                </span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (q.type === 'order') {
                return '';
            } else if (q.type === 'matching') {
                return '';
            }
            return '';
        }

        function selectOption(idx) {
            sound.kick();
            gameState.selectedOption = idx;
            renderApp();
        }

        function submitAnswer() {
            const currentQ = gameState.questionsList[gameState.questionIndex];
            let isCorrect = false;
            let userAnswerText = '';

            if (currentQ.type === 'mcq' || currentQ.type === 'true_false') {
                if (gameState.selectedOption === null) return;
                isCorrect = (gameState.selectedOption === currentQ.correct);
                userAnswerText = currentQ.options[gameState.selectedOption];
            } else if (currentQ.type === 'order') {
                isCorrect = JSON.stringify(gameState.orderList) === JSON.stringify(currentQ.correctOrder);
                userAnswerText = gameState.orderList.map(i => currentQ.items[i]).join(' ➔ ');
            } else if (currentQ.type === 'matching') {
                let allCorrect = true;
                for (let k in currentQ.correctPairs) {
                    if (gameState.matchingSelections.pairs[k] !== currentQ.correctPairs[k]) {
                        allCorrect = false;
                        break;
                    }
                }
                isCorrect = allCorrect && Object.keys(gameState.matchingSelections.pairs).length === currentQ.leftItems.length;
                userAnswerText = 'تم التوصيل اليدوي';
            }

            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.showFeedback = true;
            gameState.lastResultStatus = isCorrect ? 'correct' : 'wrong';

            const activeTeam = gameState.teams[gameState.currentTeamIndex];
            if (isCorrect) {
                activeTeam.score += 1;
                sound.correct();
                sound.goal();
                gameState.ballState = gameState.gameMode === 'solo' && gameState.currentTeamIndex === 0 ? 'moving_away' : 'moving_home';
            } else {
                sound.wrong();
                if (gameState.gameMode === 'solo') {
                    gameState.teams[1].score += 1;
                }
                gameState.ballState = 'moving_home';
            }

            gameState.userAnswers.push({
                questionId: currentQ.id,
                title: currentQ.title,
                question: currentQ.question,
                userAnswerText: userAnswerText,
                correctAnswerText: getCorrectAnswerText(currentQ),
                isCorrect: isCorrect,
                isTimeout: false,
                explanation: currentQ.explanation,
                visualType: currentQ.visualType
            });

            renderApp();
        }

        function renderFeedbackView(q) {
            const lastStatus = gameState.lastResultStatus;
            const isCorrect = lastStatus === 'correct';

            return `
                <div class="bg-emerald-900/90 border-2 ${isCorrect ? 'border-yellow-400' : 'border-red-500'} rounded-2xl p-2.5 animate-pulse-slow">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-lg">${isCorrect ? '⚽' : '❌'}</span>
                        <div>
                            <h4 class="font-black text-xs sm:text-sm ${isCorrect ? 'text-yellow-300' : 'text-red-400'}">
                                ${isCorrect ? 'هجمة ناجحة! جووووول!' : lastStatus === 'timeout' ? '⏱️ انتهى الوقت!' : 'هجمة ضائعة!'}
                            </h4>
                            <p class="text-[11px] text-emerald-200">الإجابة الصحيحة: <strong class="text-white">${getCorrectAnswerText(q)}</strong></p>
                        </div>
                    </div>
                    <div class="mt-1.5 pt-1.5 border-t border-emerald-800 text-[11px] text-emerald-100 leading-relaxed">
                        <strong class="text-yellow-300 block mb-0.5">💡 لماذا؟ (التفسير العلمي):</strong>
                        ${q.explanation}
                    </div>
                </div>
            `;
        }

        function nextQuestion() {
            gameState.questionIndex++;
            if (gameState.gameMode === 'multi') {
                gameState.currentTeamIndex = (gameState.currentTeamIndex + 1) % gameState.teams.length;
            } else {
                gameState.currentTeamIndex = 0;
            }

            if (gameState.questionIndex >= gameState.questionsList.length) {
                gameState.matchOver = true;
                gameState.screen = 'result';
                sound.endMatch();
            } else {
                setupQuestionState();
            }
            renderApp();
        }

        function renderResultScreen() {
            const totalQ = gameState.questionsList.length;
            const correctCount = gameState.userAnswers.filter(a => a.isCorrect).length;
            const wrongCount = gameState.userAnswers.filter(a => !a.isCorrect && !a.isTimeout).length;
            const timeoutCount = gameState.userAnswers.filter(a => a.isTimeout).length;
            const percentage = Math.round((correctCount / totalQ) * 100);

            let levelTitle = '';
            let levelBadge = '';
            if (percentage >= 90) {
                levelTitle = 'بطل الكيمياء 🏆';
                levelBadge = 'bg-yellow-500 text-slate-950';
            } else if (percentage >= 80) {
                levelTitle = 'نجم الكيمياء 🥇';
                levelBadge = 'bg-cyan-500 text-slate-950';
            } else if (percentage >= 70) {
                levelTitle = 'خبير علمي واعد 🔬';
                levelBadge = 'bg-teal-500 text-slate-950';
            } else if (percentage >= 60) {
                levelTitle = 'مستكشف الكيمياء 🧪';
                levelBadge = 'bg-emerald-600 text-white';
            } else {
                levelTitle = 'متدرب الكيمياء 🌱';
                levelBadge = 'bg-slate-700 text-emerald-200';
            }

            return `
                <div class="flex-1 flex flex-col justify-center items-center py-3 px-2 max-w-xl mx-auto w-full">
                    <div class="w-full bg-emerald-950/95 border-2 border-emerald-500/50 rounded-3xl p-4 sm:p-6 shadow-2xl text-center">
                        <div class="inline-block bg-yellow-500 text-slate-950 px-3 py-0.5 rounded-full text-xs font-black mb-1.5 shadow">
                            🏆 انتهت المباراة بفوز الوحدة الأولى!
                        </div>
                        <h2 class="text-xl font-black text-white mb-1">نتائج مباراة تحدي حالات المادة</h2>
                        <p class="text-emerald-300 text-xs mb-4">مناهج كيمياء الصف التاسع - سلطنة عمان</p>

                        <!-- Teams Final Scores -->
                        <div class="grid grid-cols-2 gap-2.5 mb-4">
                            ${gameState.teams.map((t, idx) => `
                                <div class="bg-emerald-900/80 border border-emerald-600 p-2.5 rounded-2xl shadow">
                                    <span class="text-[11px] text-emerald-300 block mb-0.5">${t.name}</span>
                                    <span class="text-xl sm:text-2xl font-black text-yellow-300">⚽ ${t.score}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Level Badge Card -->
                        <div class="bg-emerald-900/60 border border-emerald-700 p-3 rounded-2xl mb-4">
                            <span class="text-[11px] text-emerald-300 block mb-1">مستوى أداء الطالب:</span>
                            <span class="inline-block px-3 py-1 rounded-xl text-xs sm:text-sm font-black mb-1.5 ${levelBadge}">${levelTitle}</span>
                            <div class="flex justify-around text-[10px] sm:text-xs text-emerald-200 mt-1.5 font-semibold">
                                <span>✅ صحيحة: ${correctCount}</span>
                                <span>❌ خاطئة: ${wrongCount}</span>
                                <span>⏱️ متجاوزة: ${timeoutCount}</span>
                                <span>📈 النسبة: ${percentage}%</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-2 justify-center">
                            <button onclick="startSetup('${gameState.gameMode}')" class="bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow-lg transition">
                                🔄 إعادة المباراة
                            </button>
                            <button onclick="openReview()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-lg transition">
                                📋 مراجعة الإجابات
                            </button>
                            <button onclick="goHome()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                                🏠 الرئيسية
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openReview() {
            gameState.screen = 'review';
            renderApp();
        }

        function goHome() {
            gameState.screen = 'home';
            renderApp();
        }

        function toggleAudio() {
            sound.muted = !sound.muted;
            alert(sound.muted ? 'تم كتم الأصوات' : 'تم تفعيل الأصوات');
        }

        function renderReviewScreen() {
            return `
                <div class="flex-1 flex flex-col max-w-3xl mx-auto w-full py-2 px-1">
                    <div class="flex justify-between items-center mb-2.5 bg-emerald-950 p-2.5 rounded-2xl border border-emerald-600">
                        <h2 class="text-sm sm:text-base font-black text-yellow-300">📋 مراجعة الإجابات والتحليل العلمي</h2>
                        <button onclick="gameState.screen='result'; renderApp();" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1 rounded-xl text-xs font-bold">
                            🔙 رجوع للنتائج
                        </button>
                    </div>

                    <div class="space-y-2.5 overflow-y-auto max-h-[72vh] pr-1">
                        ${gameState.userAnswers.map((ans, idx) => `
                            <div class="bg-emerald-950/90 border ${ans.isCorrect ? 'border-emerald-500/60' : 'border-red-500/60'} rounded-2xl p-3 shadow">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="bg-emerald-900 text-yellow-300 px-2 py-0.5 rounded-lg text-xs font-bold">السؤال ${idx + 1}: ${ans.title}</span>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${ans.isCorrect ? 'bg-emerald-700 text-white' : 'bg-red-800 text-white'}">
                                        ${ans.isCorrect ? '✅ إجابة صحيحة' : '❌ إجابة خاطئة'}
                                    </span>
                                </div>
                                <p class="text-xs sm:text-sm font-bold text-white mb-2">${ans.question}</p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs mb-2">
                                    <div class="bg-emerald-900/50 p-2 rounded-xl border border-emerald-800">
                                        <span class="text-emerald-300 block mb-0.5">إجابتك:</span>
                                        <strong class="${ans.isCorrect ? 'text-yellow-300' : 'text-red-400'}">${ans.userAnswerText}</strong>
                                    </div>
                                    <div class="bg-emerald-900/50 p-2 rounded-xl border border-emerald-800">
                                        <span class="text-emerald-300 block mb-0.5">الإجابة الصحيحة:</span>
                                        <strong class="text-cyan-300">${ans.correctAnswerText}</strong>
                                    </div>
                                </div>

                                <div class="bg-emerald-950 p-2 rounded-xl border border-emerald-800/80 text-xs text-emerald-200 leading-relaxed">
                                    <strong class="text-yellow-300 block mb-0.5">💡 التفسير العلمي:</strong>
                                    ${ans.explanation}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
