    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.volume = 0.7;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.initialized = true;
                } catch(e) {
                    console.warn("Web Audio API not supported", e);
                }
            }

            setMute(muted) {
                this.isMuted = muted;
            }

            setVolume(val) {
                this.volume = Math.max(0, Math.min(1, val));
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.isMuted || !this.ctx) return;
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    gain.gain.setValueAtTime(gainVal * this.volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playClick() {
                this.init();
                this.playTone(600, 'sine', 0.08, 0.05);
            }

            playWheelTick() {
                this.init();
                this.playTone(440, 'triangle', 0.05, 0.08);
            }

            playChallengeReveal() {
                this.init();
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.15 * this.volume, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            playCorrect() {
                this.init();
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15 * this.volume, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }

            playWrong() {
                this.init();
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.4);
                gain.gain.setValueAtTime(0.18 * this.volume, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playLabPowerOn() {
                this.init();
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.8);
                gain.gain.setValueAtTime(0.2 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.9);
            }

            playVictory() {
                this.init();
                if (this.isMuted || !this.ctx) return;
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.50];
                notes.forEach((f, i) => {
                    setTimeout(() => {
                        this.playTone(f, 'sine', 0.25, 0.2);
                    }, i * 120);
                });
            }
        }

        const sound = new SoundEngine();
    </script>

    <script>
        const GAME_STATES = {
            START: 'START',
            SETUP: 'SETUP',
            COUNTDOWN: 'COUNTDOWN',
            WHEEL: 'WHEEL',
            CHALLENGE_REVEAL: 'CHALLENGE_REVEAL',
            QUESTION: 'QUESTION',
            FEEDBACK: 'FEEDBACK',
            TEAM_TRANSITION: 'TEAM_TRANSITION',
            FINISHED: 'FINISHED'
        };

        class ChallengeWheelLab {
            constructor() {
                this.currentState = GAME_STATES.START;
                this.mode = 'solo';
                this.studentName = 'بطل الكيمياء';
                this.teams = [];
                this.currentTeamIndex = 0;
                
                this.questionIndex = 0;
                this.totalQuestions = 10;
                this.score = 0;
                this.energy = 0;
                this.stars = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.unansweredCount = 0;

                this.timerEnabled = true;
                this.timeLeft = 30;
                this.timerInterval = null;

                // Interactive States
                this.selectedAnswerIndex = null;
                this.activeMatchingPairs = {};
                this.activeSorting = { "القلويات": [], "الهالوجينات": [], "الغازات النبيلة": [] };
                this.activeOrderingSequence = [];

                // Wheel properties
                this.wheel = {
                    sectors: [
                        { name: "اكتشف", color: "#0284c7", icon: "🔵" },
                        { name: "صح أم خطأ", color: "#16a34a", icon: "🟢" },
                        { name: "شاهد وحلل", color: "#9333ea", icon: "🟣" },
                        { name: "وصّل", color: "#ea580c", icon: "🟠" },
                        { name: "رتّب", color: "#dc2626", icon: "🔴" },
                        { name: "صنّف", color: "#ca8a04", icon: "⚙️" },
                        { name: "تحدي المختبر", color: "#0d9488", icon: "🧪" },
                        { name: "طبّق", color: "#2563eb", icon: "🟡" }
                    ],
                    angle: 0,
                    isSpinning: false
                };

                this.initApp();
            }

            initApp() {
                this.bindGlobalEvents();
                this.renderScreen(GAME_STATES.START);
            }

            bindGlobalEvents() {
                const btnToggleSound = document.getElementById("btnToggleSound");
                const iconSoundOn = document.getElementById("iconSoundOn");
                const iconSoundOff = document.getElementById("iconSoundOff");
                const volumeSlider = document.getElementById("volumeSlider");
                const volumeText = document.getElementById("volumeText");

                btnToggleSound.addEventListener("click", () => {
                    sound.isMuted = !sound.isMuted;
                    iconSoundOn.classList.toggle("hidden", sound.isMuted);
                    iconSoundOff.classList.toggle("hidden", !sound.isMuted);
                    sound.setMute(sound.isMuted);
                    if (!sound.isMuted) sound.playClick();
                });

                volumeSlider.addEventListener("input", (e) => {
                    const val = parseInt(e.target.value, 10);
                    volumeText.textContent = val + "%";
                    sound.setVolume(val / 100);
                });

                document.getElementById("btnHome").addEventListener("click", () => {
                    sound.playClick();
                    this.stopTimer();
                    this.renderScreen(GAME_STATES.START);
                });
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            renderScreen(state) {
                this.currentState = state;
                this.stopTimer();
                const container = document.getElementById("mainContent");
                container.innerHTML = "";

                switch(state) {
                    case GAME_STATES.START:
                        container.innerHTML = this.getStartScreenHTML();
                        this.bindStartEvents();
                        break;
                    case GAME_STATES.SETUP:
                        container.innerHTML = this.getSetupScreenHTML();
                        this.bindSetupEvents();
                        break;
                    case GAME_STATES.COUNTDOWN:
                        container.innerHTML = this.getCountDownHTML();
                        this.startCountdownAnimation();
                        break;
                    case GAME_STATES.WHEEL:
                        container.innerHTML = this.getWheelScreenHTML();
                        this.initWheelCanvas();
                        this.bindWheelEvents();
                        break;
                    case GAME_STATES.QUESTION:
                        container.innerHTML = this.getQuestionScreenHTML();
                        this.bindQuestionEvents();
                        if (this.timerEnabled) this.startQuestionTimer();
                        break;
                    case GAME_STATES.FEEDBACK:
                        container.innerHTML = this.getFeedbackScreenHTML();
                        this.bindFeedbackEvents();
                        break;
                    case GAME_STATES.TEAM_TRANSITION:
                        container.innerHTML = this.getTeamTransitionHTML();
                        this.bindTeamTransitionEvents();
                        break;

            initWheelCanvas() {
                const canvas = document.getElementById("wheelCanvas");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const sectors = this.wheel.sectors;
                const numSectors = sectors.length;
                const arcSize = (2 * Math.PI) / numSectors;

                const drawWheel = (currentAngle) => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const center = canvas.width / 2;
                    const radius = center - 10;

                    sectors.forEach((sector, i) => {
                        const angle = currentAngle + i * arcSize;
                        ctx.beginPath();
                        ctx.moveTo(center, center);
                        ctx.arc(center, center, radius, angle, angle + arcSize);
                        ctx.closePath();
                        ctx.fillStyle = sector.color;
                        ctx.fill();
                        ctx.strokeStyle = "#030712";
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.save();
                        ctx.translate(center, center);
                        ctx.rotate(angle + arcSize / 2);
                        ctx.textAlign = "right";
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 15px 'Changa', sans-serif";
                        ctx.fillText(sector.icon + " " + sector.name, radius - 25, 6);
                        ctx.restore();
                    });
                };

                drawWheel(this.wheel.angle);
                this.drawWheelStaticRef = drawWheel;
            }

            bindWheelEvents() {
                const triggerSpin = () => {
                    if (this.wheel.isSpinning) return;
                    this.wheel.isSpinning = true;
                    sound.init();

                    const announcement = document.getElementById("wheelAnnouncement");
                    announcement.innerHTML = `<span class="text-amber-400 animate-pulse">جاري تدوير العجلة لاختيار التحدي...</span>`;

                    const canvas = document.getElementById("wheelCanvas");
                    const sectors = this.wheel.sectors;
                    const numSectors = sectors.length;
                    const arcSize = (2 * Math.PI) / numSectors;

                    const currentQ = CHEMISTRY_QUESTIONS[this.questionIndex];
                    const targetIndex = sectors.findIndex(s => s.name === currentQ.wheelType);
                    const chosenIndex = targetIndex !== -1 ? targetIndex : Math.floor(Math.random() * numSectors);

                    const extraSpins = 5 + Math.random() * 3;
                    const targetAngleCenter = -Math.PI / 2 - (chosenIndex + 0.5) * arcSize;
                    const normalizedTarget = (targetAngleCenter % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                    const currentMod = (this.wheel.angle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                    let diff = normalizedTarget - currentMod;
                    if (diff < 0) diff += 2 * Math.PI;

                    const totalDelta = extraSpins * 2 * Math.PI + diff;
                    const startAngle = this.wheel.angle;
                    const startTime = performance.now();
                    const duration = 3200;

                    let lastTickSector = -1;

                    const animateSpin = (currentTime) => {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(1, elapsed / duration);
                        const easeProgress = 1 - Math.pow(1 - progress, 3);

                        this.wheel.angle = startAngle + totalDelta * easeProgress;

                        if (this.drawWheelStaticRef) {
                            this.drawWheelStaticRef(this.wheel.angle);
                        }

                        const currentSectorChecked = Math.floor(((-this.wheel.angle - Math.PI/2) % (2 * Math.PI) + 2 * Math.PI) / arcSize % numSectors);
                        if (currentSectorChecked !== lastTickSector) {
                            sound.playWheelTick();
                            lastTickSector = currentSectorChecked;
                        }

                        if (progress < 1) {
                            requestAnimationFrame(animateSpin);
                        } else {
                            this.wheel.isSpinning = false;
                            sound.playChallengeReveal();
                            const selectedSector = sectors[chosenIndex];
                            announcement.innerHTML = `تم اختيار التحدي: <span class="text-amber-300 font-bold text-lg">${selectedSector.icon} ${selectedSector.name}</span>`;

                            setTimeout(() => {
                                this.renderScreen(GAME_STATES.QUESTION);
                            }, 1200);
                        }
                    };

                    requestAnimationFrame(animateSpin);
                };

                document.getElementById("btnSpinWheelHub").addEventListener("click", triggerSpin);
                document.getElementById("btnSpinWheelAction").addEventListener("click", triggerSpin);
                document.getElementById("wheelCanvas").addEventListener("click", triggerSpin);
            }

                                <div class="space-y-2">
                                    ${["المجموعة 1", "المجموعة 7", "غاز نبيل", "هالوجين"].map(rightText => `
                                        <button type="button" class="matching-right-btn w-full p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-amber-400 text-right text-slate-200 font-changa text-sm transition" data-right="${rightText}">

                        </div>

                            ${qData.categories.map(cat => `
                                <div class="sort-category-box bg-slate-950/90 border border-slate-800 hover:border-amber-400 p-4 rounded-2xl flex flex-col min-h-[140px] cursor-pointer transition" data-category="${cat.name}">
                                    <div class="text-sm font-bold text-amber-400 font-changa mb-2 pb-2 border-b border-slate-800 text-center">${cat.name}</div>

                        </div>

                        <div class="text-center">
                            <button id="btnResetSorting" type="button" class="text-xs text-red-400 hover:underline">إعادة تعيين التصنيف</button>

                if (qData.type === 'ordering') {

                        <div id="orderingPool" class="space-y-2">
                            ${qData.availableItems.map(item => `
                                <button type="button" class="order-item-btn w-full p-3.5 rounded-xl bg-slate-950 border border-cyan-500/40 text-cyan-200 font-changa text-sm hover:border-cyan-300 text-right transition flex items-center justify-between" data-key="${item.key}" data-text="${item.text}">
                                    <span>${item.text}</span>
                                    <span class="text-xs text-cyan-400">➕ إضافة للترتيب</span>

                        <div class="bg-slate-950/90 border border-amber-500/40 p-4 rounded-2xl">
                            <div class="text-xs font-bold text-amber-400 font-changa mb-3">📋 الترتيب الحالي المعتمد:</div>
                            <div id="currentOrderingList" class="space-y-2 min-h-[60px]">
                                <span class="text-xs text-slate-500 italic">لم يتم اختيار أي ترتيب بعد...</span>
                            </div>
                            <div class="mt-3 text-right">
                                <button id="btnResetOrdering" type="button" class="text-xs text-red-400 hover:underline">إعادة ضبط الترتيب</button>
                            </div>
                        </div>
                    </div>`;
                }

                return '';
            }

            bindQuestionEvents() {
                const qData = CHEMISTRY_QUESTIONS[this.questionIndex];
                this.selectedAnswerIndex = null;
                this.activeMatchingPairs = {};
                this.activeSorting = { "القلويات": [], "الهالوجينات": [], "الغازات النبيلة": [] };
                this.activeOrderingSequence = [];

                if (qData.options) {
                    const optBtns = document.querySelectorAll(".option-btn");
                    optBtns.forEach((btn, idx) => {
                        btn.addEventListener("click", () => {
                            sound.playClick();
                            optBtns.forEach(b => {
                                b.classList.remove("border-cyan-400", "bg-cyan-950/60");
                                b.querySelector(".option-indicator").textContent = "⚪";
                            });
                            btn.classList.add("border-cyan-400", "bg-cyan-950/60");
                            btn.querySelector(".option-indicator").textContent = "🟢";
                            this.selectedAnswerIndex = idx;
                        });
                    });
                } else if (qData.type === 'matching') {
                    let selectedLeftId = null;
                    const leftBtns = document.querySelectorAll(".matching-left-btn");
                    const rightBtns = document.querySelectorAll(".matching-right-btn");

                    leftBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            sound.playClick();
                            leftBtns.forEach(b => b.classList.remove("border-amber-400", "bg-amber-950/30"));
                            btn.classList.add("border-amber-400", "bg-amber-950/30");
                            selectedLeftId = btn.dataset.id;
                        });
                    });

                    rightBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            if (!selectedLeftId) return;
                            sound.playClick();
                            const rightText = btn.dataset.right;
                            this.activeMatchingPairs[selectedLeftId] = rightText;
                            selectedLeftId = null;
                            leftBtns.forEach(b => b.classList.remove("border-amber-400", "bg-amber-950/30"));
                            this.updateMatchingUI();
                        });
                    });

                    document.getElementById("btnResetMatching").addEventListener("click", () => {
                        sound.playClick();
                        this.activeMatchingPairs = {};
                        this.updateMatchingUI();
                    });
                } else if (qData.type === 'sorting') {
                    let activeItem = null;
                    const poolBtns = document.querySelectorAll(".sort-item-btn");
                    const catBoxes = document.querySelectorAll(".sort-category-box");

                    poolBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            sound.playClick();
                            poolBtns.forEach(b => b.classList.remove("border-amber-400", "bg-amber-950/40"));
                            btn.classList.add("border-amber-400", "bg-amber-950/40");
                            activeItem = btn.dataset.item;
                        });
                    });

                    catBoxes.forEach(box => {
                        box.addEventListener("click", () => {
                            if (!activeItem) return;
                            sound.playClick();
                            const category = box.dataset.category;
                            
                            Object.keys(this.activeSorting).forEach(cat => {
                                this.activeSorting[cat] = this.activeSorting[cat].filter(i => i !== activeItem);
                            });

                            this.activeSorting[category].push(activeItem);
                            activeItem = null;
                            poolBtns.forEach(b => b.classList.remove("border-amber-400", "bg-amber-950/40"));
                            this.updateSortingUI();
                        });
                    });

                    document.getElementById("btnResetSorting").addEventListener("click", () => {
                        sound.playClick();
                        this.activeSorting = { "القلويات": [], "الهالوجينات": [], "الغازات النبيلة": [] };
                        this.updateSortingUI();
                    });
                } else if (qData.type === 'ordering') {
                    const itemBtns = document.querySelectorAll(".order-item-btn");
                    itemBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            sound.playClick();
                            const key = btn.dataset.key;
                            const text = btn.dataset.text;
                            if (!this.activeOrderingSequence.some(i => i.key === key)) {
                                this.activeOrderingSequence.push({ key, text });
                                this.updateOrderingUI();
                            }
                        });
                    });

                    document.getElementById("btnResetOrdering").addEventListener("click", () => {
                        sound.playClick();
                        this.activeOrderingSequence = [];
                        this.updateOrderingUI();
                    });
                }

                document.getElementById("btnConfirmAnswer").addEventListener("click", () => {
                    this.handleAnswerConfirmation();
                });
            }

            updateMatchingUI() {
                const container = document.getElementById("currentMatchingList");
                const qData = CHEMISTRY_QUESTIONS[this.questionIndex];
                const pairs = Object.entries(this.activeMatchingPairs);
                if (pairs.length === 0) {
                    container.innerHTML = `<span class="text-slate-500 italic">لم تقم بأي توصيل بعد...</span>`;
                    return;
                }
                container.innerHTML = pairs.map(([leftId, rightText]) => {
                    const leftObj = qData.pairs.find(p => p.id == leftId);
                    return `<div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
                        <span>${leftObj ? leftObj.left : ''} ➔ <strong class="text-amber-300">${rightText}</strong></span>
                        <button type="button" class="text-red-400 text-[10px] hover:underline" onclick="game.removeMatchingPair(${leftId})">إلغاء</button>
                    </div>`;
                }).join('');
            }

            removeMatchingPair(leftId) {
                sound.playClick();
                delete this.activeMatchingPairs[leftId];
                this.updateMatchingUI();
            }

            updateSortingUI() {
                const qData = CHEMISTRY_QUESTIONS[this.questionIndex];
                qData.categories.forEach(cat => {
                    const box = document.querySelector(`.category-items-container[data-category="${cat.name}"]`);
                    const items = this.activeSorting[cat.name];
                    if (items.length === 0) {
                        box.innerHTML = `<span class="text-xs text-slate-500 italic">انقر لوضع العنصر هنا</span>`;
                    } else {
                        box.innerHTML = items.map(item => `<span class="px-2.5 py-1 rounded-lg bg-cyan-950 border border-cyan-400 text-cyan-200 text-xs font-changa">${item}</span>`).join('');
                    }
                });
            }

            updateOrderingUI() {
                const container = document.getElementById("currentOrderingList");
                if (this.activeOrderingSequence.length === 0) {
                    container.innerHTML = `<span class="text-xs text-slate-500 italic">لم يتم اختيار أي ترتيب بعد...</span>`;
                    return;
                }
                container.innerHTML = this.activeOrderingSequence.map((item, idx) => `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-xs">
                        <span>${idx + 1}. ${item.text}</span>
                        <button type="button" class="text-red-400 hover:underline" onclick="game.removeOrderItem('${item.key}')">حذف</button>
                    </div>
                `).join('');
            }

            removeOrderItem(key) {
                sound.playClick();
                this.activeOrderingSequence = this.activeOrderingSequence.filter(i => i.key !== key);
                this.updateOrderingUI();
            }

            startQuestionTimer() {
                this.timeLeft = 30;
                const display = document.getElementById("timerDisplay");
                if (!display) return;

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    display.textContent = this.timeLeft + " ثانية";
                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.handleTimeOut();
                    }
                }, 1000);
            }

            handleTimeOut() {
                this.stopTimer();
                this.unansweredCount++;
                if (this.mode === 'teams') {
                    this.teams[this.currentTeamIndex].wrong++;
                }
                this.lastAnswerResult = 'timeout';
                this.renderScreen(GAME_STATES.FEEDBACK);
            }

            handleAnswerConfirmation() {
                this.stopTimer();
                const qData = CHEMISTRY_QUESTIONS[this.questionIndex];
                let isCorrect = false;

                if (qData.options) {
                    if (this.selectedAnswerIndex === null) {
                        alert("يرجى اختيار إجابة أولاً!");
                        return;
                    }
                    isCorrect = (this.selectedAnswerIndex === qData.correctAnswer);
                } else if (qData.type === 'matching') {
                    if (Object.keys(this.activeMatchingPairs).length < qData.pairs.length) {
                        alert("يرجى إكمال توصيل جميع العناصر أولاً!");
                        return;
                    }
                    isCorrect = qData.pairs.every(p => this.activeMatchingPairs[p.id] === p.right);
                } else if (qData.type === 'sorting') {
                    isCorrect = qData.categories.every(cat => {
                        const userArr = this.activeSorting[cat.name].slice().sort();
                        const correctArr = cat.items.slice().sort();
                        return userArr.length === correctArr.length && userArr.every((v, i) => v === correctArr[i]);
                    });
                } else if (qData.type === 'ordering') {
                    if (this.activeOrderingSequence.length < qData.correctSequence.length) {
                        alert("يرجى إكمال ترتيب العناصر أولاً!");
                        return;
                    }
                    isCorrect = qData.correctSequence.every((item, idx) => this.activeOrderingSequence[idx] && this.activeOrderingSequence[idx].key === item.key);
                }

                this.lastAnswerResult = isCorrect ? 'correct' : 'wrong';

                if (isCorrect) {
                    sound.playCorrect();
                    this.correctCount++;
                    this.score += 100;
                    this.energy = Math.min(100, this.energy + 10);
                    this.stars = Math.min(10, this.stars + 1);

                    if (this.mode === 'teams') {
                        const t = this.teams[this.currentTeamIndex];
                        t.score += 100;
                        t.energy = Math.min(100, t.energy + 10);
                        t.stars = Math.min(10, t.stars + 1);
                        t.correct++;
                    }
                } else {
                    sound.playWrong();
                    this.wrongCount++;
                    if (this.mode === 'teams') {
                        this.teams[this.currentTeamIndex].wrong++;
                    }
                }

                this.renderScreen(GAME_STATES.FEEDBACK);
            }

            // --- 6. FEEDBACK SCREEN ---
            getFeedbackScreenHTML() {
                const qData = CHEMISTRY_QUESTIONS[this.questionIndex];
                let resultTitle = "";
                let resultClass = "";

                if (this.lastAnswerResult === 'correct') {
                    resultTitle = "🌟 إجابة صحيحة وممتازة!";
                    resultClass = "text-emerald-400 bg-emerald-950/40 border-emerald-500/40";
                } else if (this.lastAnswerResult === 'timeout') {
                    resultTitle = "⏰ انتهى الوقت المخصص للسؤال!";
                    resultClass = "text-amber-400 bg-amber-950/40 border-amber-500/40";
                } else {
                    resultTitle = "❌ إجابة غير صحيحة";
                    resultClass = "text-rose-400 bg-rose-950/40 border-rose-500/40";
                }

                return `
                <div class="w-full max-w-3xl mx-auto glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl animate-fade-in text-center">
                    
                    <div class="py-4 px-6 rounded-2xl border ${resultClass} mb-6">
                        <h3 class="text-2xl font-black font-changa mb-1">${resultTitle}</h3>
                    </div>

                    <div class="bg-slate-950/90 border border-cyan-500/40 p-6 rounded-2xl text-right mb-8 shadow-inner">
                        <div class="text-xs font-bold text-cyan-400 uppercase tracking-wider font-changa mb-2 flex items-center gap-2">
                            <span>💡</span>
                            <span>التفسير العلمي (لماذا؟):</span>
                        </div>
                        <p class="text-sm sm:text-base text-slate-200 leading-relaxed">${qData.explanation}</p>
                    </div>

                    <button id="btnContinueChallenge" type="button" class="w-full sm:w-auto px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-slate-950 font-changa font-bold text-lg shadow-xl shadow-cyan-500/40 transition">
                        متابعة التحدي 🎡
                    </button>

                </div>`;
            }

            bindFeedbackEvents() {
                document.getElementById("btnContinueChallenge").addEventListener("click", () => {
                    sound.playClick();
                    this.questionIndex++;

                    if (this.questionIndex >= this.totalQuestions) {
                        this.renderScreen(GAME_STATES.FINISHED);
                    } else {
                        if (this.mode === 'teams') {
                            this.currentTeamIndex = (this.currentTeamIndex + 1) % this.teams.length;
                            this.renderScreen(GAME_STATES.TEAM_TRANSITION);
                        } else {
                            this.renderScreen(GAME_STATES.WHEEL);
                        }
                    }
                });
            }

            // --- 7. TEAM TRANSITION SCREEN ---
            getTeamTransitionHTML() {
                const nextTeam = this.teams[this.currentTeamIndex];
                return `
                <div class="w-full max-w-xl mx-auto glass-panel rounded-3xl p-8 text-center shadow-2xl animate-fade-in">
                    <div class="text-4xl mb-3">👥</div>
                    <h3 class="text-xl text-slate-400 font-changa mb-2">دور المنافسة التالي</h3>
                    <div class="text-3xl font-black font-changa text-cyan-300 mb-6 bg-slate-950/80 py-4 px-6 rounded-2xl border border-cyan-500/40">${nextTeam.name}</div>
                    <button id="btnStartNextTeam" type="button" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-changa font-bold text-lg shadow-lg shadow-amber-500/40 transition">
                        استعد للتدوير 🎡
                    </button>
                </div>`;
            }

            bindTeamTransitionEvents() {
                document.getElementById("btnStartNextTeam").addEventListener("click", () => {
                    sound.playClick();
                    this.renderScreen(GAME_STATES.WHEEL);
                });
            }

            // --- 8. FINISHED SCREEN ---
            getFinishedScreenHTML() {
                const accuracy = Math.round((this.correctCount / this.totalQuestions) * 100);
                let rankTitle = "";
                let rankColor = "";

                if (accuracy >= 90) {
                    rankTitle = "⚡ خبير الجدول الدوري";
                    rankColor = "text-amber-300 border-amber-500/50 bg-amber-950/40";
                } else if (accuracy >= 80) {
                    rankTitle = "🧪 عالم العناصر";
                    rankColor = "text-cyan-300 border-cyan-500/50 bg-cyan-950/40";
                } else if (accuracy >= 70) {
                    rankTitle = "🔬 مستكشف الكيمياء";
                    rankColor = "text-sky-300 border-sky-500/50 bg-sky-950/40";
                } else if (accuracy >= 60) {
                    rankTitle = "⚙️ باحث كيميائي واعد";
                    rankColor = "text-emerald-300 border-emerald-500/50 bg-emerald-950/40";
                } else {
                    rankTitle = "🌱 متدرب المختبر";
                    rankColor = "text-slate-300 border-slate-700 bg-slate-900";
                }

                return `
                <div class="w-full max-w-3xl mx-auto glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl animate-fade-in text-center">
                    
                    <div class="text-4xl mb-2">⚡</div>
                    <h2 class="text-2xl sm:text-3xl font-black font-changa text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-400 to-amber-300 mb-2">
                        تم تشغيل مختبر التحدي بالكامل!
                    </h2>
                    <p class="text-sm text-slate-300 mb-6">أحسنت! لقد أتقنت التركيب الأيوني والجدول الدوري بنجاح تام.</p>

                    <div class="py-3 px-6 rounded-2xl border ${rankColor} mb-6 inline-block font-changa text-lg font-bold shadow-lg">
                        الرتبة النهائية: ${rankTitle}
                    </div>

                    ${this.mode === 'solo' ? `
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl">
                                <div class="text-xs text-slate-400 mb-1">النقاط الكلية</div>
                                <div class="text-xl font-bold font-changa text-amber-300">${this.score} / 1000</div>
                            </div>
                            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl">
                                <div class="text-xs text-slate-400 mb-1">الإجابات الصحيحة</div>
                                <div class="text-xl font-bold font-changa text-emerald-400">${this.correctCount}</div>
                            </div>
                            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl">
                                <div class="text-xs text-slate-400 mb-1">نسبة الدقة</div>
                                <div class="text-xl font-bold font-changa text-cyan-300">${accuracy}%</div>
                            </div>
                            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl">
                                <div class="text-xs text-slate-400 mb-1">النجوم</div>
                                <div class="text-xl font-bold font-changa text-yellow-300">⭐ ${this.stars} / 10</div>
                            </div>
                        </div>
                    ` : `
                        <div class="space-y-3 mb-8">
                            <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider font-changa">ترتيب الفرق المنافسة:</h4>
                            <div class="space-y-2">
                                ${this.teams.sort((a,b) => b.score - a.score).map((t, idx) => `
                                    <div class="flex items-center justify-between bg-slate-950/90 border border-cyan-900/50 p-4 rounded-2xl">
                                        <div class="flex items-center gap-3">
                                            <span class="w-8 h-8 rounded-xl bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 font-changa font-bold flex items-center justify-center">#${idx + 1}</span>
                                            <span class="font-changa font-bold text-slate-200 text-base">${t.name}</span>
                                        </div>
                                        <div class="flex items-center gap-4 text-xs font-changa">
                                            <div>النقاط: <strong class="text-amber-300">${t.score}</strong></div>
                                            <div>الصحيحة: <strong class="text-emerald-400">${t.correct}</strong></div>
                                            <div>النجوم: <strong class="text-yellow-300">⭐ ${t.stars}</strong></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `}

                    <div class="flex flex-wrap items-center justify-center gap-4">
                        <button id="btnPlayAgain" type="button" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-500 text-slate-950 font-changa font-bold text-sm shadow-lg shadow-cyan-500/30 transition">
                            🔄 إعادة اللعب
                        </button>
                        <button id="btnEditSettings" type="button" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-changa font-bold text-sm transition">
                            ⚙️ تعديل الإعدادات
                        </button>
                        <button id="btnReturnHome" type="button" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 font-changa font-bold text-sm transition">
                            🏠 الرئيسية
                        </button>
                    </div>

                </div>`;
            }

            bindFinishedEvents() {
                document.getElementById("btnPlayAgain").addEventListener("click", () => {
                    sound.playClick();
                    this.questionIndex = 0;
                    this.score = 0;
                    this.energy = 0;
                    this.stars = 0;
                    this.correctCount = 0;
                    this.wrongCount = 0;
                    this.unansweredCount = 0;
                    this.currentTeamIndex = 0;
                    if (this.teams.length > 0) {
                        this.teams.forEach(t => { t.score = 0; t.energy = 0; t.stars = 0; t.correct = 0; t.wrong = 0; });
                    }
                    this.renderScreen(GAME_STATES.WHEEL);
                });

                document.getElementById("btnEditSettings").addEventListener("click", () => {
                    sound.playClick();
                    this.renderScreen(GAME_STATES.SETUP);
                });

                document.getElementById("btnReturnHome").addEventListener("click", () => {
                    sound.playClick();
                    this.renderScreen(GAME_STATES.START);
                });
            }
        }

        let game = null;
        window.addEventListener("load", () => {
            game = new ChallengeWheelLab();
        });
    </script>
</body>
</html>
